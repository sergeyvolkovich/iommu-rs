[workspace]
resolver = "2"
members = ["amd-iommu", "intel-iommu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.77"

[workspace.dependencies]
# Zero-copy binary layout interpretation (no_std, derive macros)
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
# Flag bitfields
bitflags = { version = "2.9", default-features = false }
# MMIO register abstraction
tock-registers = "0.9"
# Error derive (no_std)
thiserror = { version = "2.0", default-features = false }
# Logging facade (no_std)
log = { version = "0.4", default-features = false }
